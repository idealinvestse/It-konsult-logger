<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT-konsult tidrapport</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="app-header">
      <h1>IT-konsult tidrapport</h1>
      <p>Registrera dina arbetade timmar, aktivitetstyp och anteckningar.</p>
    </header>

    <main class="layout">
      <section class="card" aria-labelledby="registrering-title">
        <h2 id="registrering-title">Registrera arbetspass</h2>
        <form id="log-form" class="form-grid">
          <div class="form-field">
            <label for="client">Kund</label>
            <input
              type="text"
              id="client"
              name="client"
              placeholder="Ex. Acme AB"
              required
            />
          </div>

          <div class="form-field">
            <label for="date">Datum</label>
            <input type="date" id="date" name="date" required />
          </div>

          <div class="form-field">
            <label for="start-time">Starttid</label>
            <input type="time" id="start-time" name="start-time" required />
          </div>

          <div class="form-field">
            <label for="end-time">Sluttid</label>
            <input type="time" id="end-time" name="end-time" required />
          </div>

          <div class="form-field">
            <label for="work-type">Typ av arbete</label>
            <select id="work-type" name="work-type" required>
              <option value="" disabled selected>Välj...</option>
              <option value="konsultation">Konsultation</option>
              <option value="utveckling">Utveckling</option>
              <option value="support">Support</option>
              <option value="workshop">Workshop</option>
              <option value="annat">Annat</option>
            </select>
          </div>

          <div class="form-field">
            <label for="notes">Anteckningar</label>
            <textarea
              id="notes"
              name="notes"
              rows="3"
              placeholder="Beskriv aktivitet eller leverabler"
            ></textarea>
          </div>

          <div class="form-field form-field--full">
            <div class="summary" role="status" aria-live="polite">
              <span id="hours-summary">0,0 timmar</span>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Lägg till</button>
            <button type="reset" class="btn btn-secondary" id="reset-form">
              Rensa
            </button>
            <button type="button" class="btn btn-secondary" id="export-btn">Exportera CSV</button>
            <button type="button" class="btn btn-secondary" id="import-btn">Importera CSV</button>
            <input type="file" id="import-file" accept=".csv" style="display: none;" />
          </div>
        </form>
      <section class="card" aria-labelledby="lista-title">
        <div class="card-header">
          <h2 id="lista-title">Registrerade poster</h2>
          <div class="filters">
            <label class="filters__label" for="customer-filter">Filtrera kund:</label>
            <select id="customer-filter" class="filters__select">
              <option value="">Alla</option>
            </select>
            <label class="filters__label" for="sort-select">Sortera:</label>
            <select id="sort-select" class="filters__select">
              <option value="date-desc">Datum (nyaste först)</option>
              <option value="date-asc">Datum (äldsta först)</option>
              <option value="hours-desc">Timmar (flest först)</option>
              <option value="hours-asc">Timmar (minst först)</option>
              <option value="client-asc">Kund (A-Ö)</option>
              <option value="client-desc">Kund (Ö-A)</option>
            </select>
          </div>
        </div>
        <div class="table-wrapper">
          <table aria-describedby="lista-title">
            <thead>
              <tr>
                <th>Datum</th>
                <th>Typ</th>
                <th>Tid</th>
                <th>Totalt</th>
                <th>Anteckningar</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="log-list"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Mall för tabellrad som används för att rendera loggade poster -->
    <template id="log-row-template">
      <tr>
        <td data-label="Kund"></td>
        <td data-label="Datum"></td>
        <td data-label="Typ"></td>
        <td data-label="Tid"></td>
        <td data-label="Totalt"></td>
        <td data-label="Anteckningar"></td>
        <td class="actions">
          <button type="button" class="btn btn-link" data-action="edit" title="Redigera">
            Redigera
          </button>
          <button type="button" class="btn btn-link" data-action="remove" title="Ta bort">
            Ta bort
          </button>
        </td>
      </tr>
    </template>

    <footer class="app-footer">
      <!-- Information om datalagring -->
      <p>
        Data sparas i din webbläsare via <span class="highlight">localStorage</span>.
      </p>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
